<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90" fill="none">
  <defs>
    <linearGradient id="tatwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="tatwaGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0066FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- High-tech Emblem Icon -->
  <g transform="translate(10, 8)" filter="url(#shadow)">
    <!-- Hexagonal / Modern Tech Shield Base -->
    <path d="M37 6 L64 21 L64 53 L37 68 L10 53 L10 21 Z" fill="url(#tatwaGrad)" opacity="0.12"/>
    <path d="M37 6 L64 21 L64 53 L37 68 L10 53 L10 21 Z" stroke="url(#tatwaGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Stylized Modern 'T' with Electric Circuit Spark -->
    <path d="M22 24 L52 24" stroke="url(#tatwaGlow)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M37 24 L37 54" stroke="url(#tatwaGlow)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Electric Energy Pulse Node -->
    <circle cx="37" cy="24" r="3.5" fill="#FFFFFF"/>
    <circle cx="52" cy="24" r="2.5" fill="#00F5A0"/>
    <circle cx="22" cy="24" r="2.5" fill="#00D2FF"/>
    <circle cx="37" cy="54" r="2.5" fill="#0066FF"/>
  </g>

  <!-- Typography: TATWA -->
  <text x="88" y="48" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#0F172A">TATWA</text>
  
  <!-- Subtitle: ELECTRONICS -->
  <text x="90" y="66" font-family="'Inter', sans-serif" font-weight="700" font-size="11" letter-spacing="7" fill="#0066FF">ELECTRONICS</text>
  
  <!-- Subtle divider dot & heritage tagline -->
  <circle cx="270" cy="40" r="2" fill="#00D2FF"/>
  <text x="280" y="43" font-family="'Inter', sans-serif" font-weight="600" font-size="9" letter-spacing="2" fill="#64748B">INNOVATION</text>
</svg>
